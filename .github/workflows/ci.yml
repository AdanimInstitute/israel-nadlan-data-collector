name: CI

# Two changes, from the org-wide draft-first / CI-cost rollout (2026-08-27).
#
# 1. `push: "codex/**"` is REMOVED. It ran the whole suite a second time on
#    every push to a feature branch, duplicating the pull_request run for the
#    same commit — and, more importantly, it would have defeated the draft
#    suppression added below: a draft PR's pushes would still have triggered a
#    full run through the push path. This needed no measurement; the trigger is
#    structurally redundant with `pull_request`.
#
# 2. Draft PRs skip every job. `ready_for_review` MUST stay in the types list:
#    it is not a default pull_request type, and without it a PR whose draft
#    pushes were all skipped would get no run when marked ready.
#
# `push: main` is KEPT, deliberately, and this is a deferral rather than an
# endorsement. Elsewhere in the rollout it was replaced by a weekly drift cron,
# because after a squash-merge it re-validates what the PR run already checked.
# Two reasons not to here: this repo recorded ZERO Actions runs in August, so
# there is no measurement to justify the swap and nothing to save; and
# `cache: pip` is in play, where push:main does a second, easily-missed job —
# keeping the shared dependency cache alive. Caches written by pull_request runs
# are scoped to refs/pull/N/merge and invisible to other branches; only
# default-branch runs write the refs/heads/main cache every branch can restore,
# and GitHub evicts after 7 days without access. In adanim-welfare-potential
# (#28) an expired cache turned a 2-billed-minute run into 7. Revisit when this
# repo has real run data.

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; runs on main are not.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pre-commit:
    name: Pre-commit
    # Draft PRs skip (reports "skipped", bills nothing).
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  unit-tests:
    name: Unit tests (py${{ matrix.python-version }})
    # Draft PRs skip (reports "skipped", bills nothing).
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      COVERAGE_FILE: .coverage.unit-py${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest -m "not integration"

      - name: Upload raw coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-agent-context-coverage-unit-py${{ matrix.python-version }}
          path: .coverage*
          include-hidden-files: true
          if-no-files-found: ignore

  integration-tests:
    name: Integration tests
    # Draft PRs skip (reports "skipped", bills nothing).
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    env:
      COVERAGE_FILE: .coverage.integration-py312
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run integration tests
        run: pytest -m integration

      - name: Upload raw coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-agent-context-coverage-integration-py312
          path: .coverage*
          include-hidden-files: true
          if-no-files-found: ignore

  type-check:
    name: Type check
    # Draft PRs skip (reports "skipped", bills nothing).
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run mypy
        run: mypy src

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    # always() is preserved so coverage still reports when a test job fails;
    # the added clause is what makes a draft PR skip it too. Without this the
    # job would run on drafts after its dependencies were skipped, with no
    # test results to collect.
    if: ${{ always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Download raw coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: pr-agent-context-coverage-*
          path: coverage-data
          merge-multiple: true

      - name: Combine coverage and generate report
        shell: bash
        run: |
          shopt -s nullglob dotglob
          coverage_files=(coverage-data/.coverage*)
          if [ ${#coverage_files[@]} -eq 0 ]; then
            echo "No coverage data artifacts were produced." | tee coverage-report.txt
            {
              echo "## Coverage"
              echo
              echo "No coverage data artifacts were produced."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          python -m coverage combine coverage-data
          python -m coverage report | tee coverage-report.txt
          python -m coverage xml -o coverage.xml

          {
            echo "## Coverage"
            echo
            echo '```text'
            cat coverage-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload combined coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: |
            coverage.xml
            coverage-report.txt
          if-no-files-found: warn

  pr-agent-context:
    name: PR agent context
    if: ${{ always() && github.event_name == 'pull_request' && !github.event.pull_request.draft }}
    needs: [pre-commit, unit-tests, integration-tests, type-check, coverage]
    permissions:
      contents: read
      actions: read
      pull-requests: write
    uses: shaypal5/pr-agent-context/.github/workflows/pr-agent-context.yml@v4
    with:
      tool_ref: v4
      publish_mode: append
      target_patch_coverage: "100"
      include_review_comments: true
      include_failing_checks: true
      include_patch_coverage: true
      patch_coverage_source_mode: coverage_xml_artifact
      coverage_report_artifact_name: coverage-xml
      coverage_report_filename: coverage.xml
      prompt_template_file: .github/pr-agent-context-template.md
      debug_artifacts: true
